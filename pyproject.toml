[project]
name = "kolproject"
version = "0.3.0"
description = "Dated, deduplicated CAR-T lymphoma HCP research dataset and reproducible analysis"
readme = "README.md"
authors = [
    { name = "Codex", email = "codex@openai.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "hydra-core==1.3.2",
    "igraph>=0.11,<0.12",
    "leidenalg>=0.10,<0.12",
    "matplotlib>=3.10,<4",
    "networkx>=3.5,<4",
    "pandas>=2.2,<4",
    "rapidfuzz>=3.14,<4",
    "requests>=2.32,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.15,<2",
]

[project.scripts]
kolproject = "kolproject.cli:main"
kolproject-utilization = "kolproject.utilization:main"
kolproject-evaluate = "kolproject.evaluate:main"
kolproject-kol = "kolproject.kol.cli:main"
kolproject-kol-site = "kolproject.kol.site:main"
kolproject-divisions = "kolproject.divisions:main"
kolproject-careset = "kolproject.careset:main"
kolproject-catchment = "kolproject.kol.catchment:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:invalid escape sequence:SyntaxWarning"]
